<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM Girişi · İmparatorun Hükmü</title><link rel="stylesheet" href="../assets/style.css"></head>
<body>
<main class="shell landing">
  <section class="hero-card" style="max-width:680px;margin:auto">
    <p class="eyebrow">YALNIZCA GM</p>
    <h1 style="font-size:50px">İmparatorun Hükmü</h1>
    <p class="lead">GM hesabınla giriş yap. Yetkin doğrulandığında doğrudan normal karakter oluşturucuya ve diğer yönetim sayfalarına erişirsin.</p>
    <div class="field" style="max-width:440px"><label for="gmEmail">GM E-POSTA ADRESİ</label><input id="gmEmail" type="email" value="resulcan834@gmail.com" autocomplete="email" required></div>
    <div class="actions"><button id="sendGmLink" class="btn" type="button">E-postama Giriş Bağlantısı Gönder</button><button id="openSavedGm" class="btn secondary" type="button">Oturumumu Kontrol Et</button><a class="btn secondary" href="../index.html">Ana Sayfa</a></div>
    <div class="field" style="max-width:240px;margin-top:14px"><label for="gmOtp">E-POSTADA 6 HANELİ KOD VARSA</label><input id="gmOtp" inputmode="numeric" autocomplete="one-time-code" placeholder="Doğrulama kodu" maxlength="8"></div>
    <div class="actions"><button id="verifyGmOtp" class="btn secondary" type="button">Kodu Doğrula</button></div>
    <div id="statusMessage" class="status">Hazırlanıyor...</div>
  </section>
</main>
<script type="module" src="../js/gm-key-login.js"></script>
</body></html>
