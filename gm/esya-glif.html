<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eşya & Focus · İmparatorun Hükmü</title><link rel="stylesheet" href="../assets/style.css"></head>

<header class="topbar"><div class="shell"><a class="brand" href="../index.html">İmparatorun Hükmü</a><nav class="nav"><a href="karakterler.html">Karakterler</a><a class="active" href="esya-glif.html">Eşya & Focus</a><a href="glif-atolyesi.html">Glif Atölyesi</a><a href="envanter.html">Envanter</a><button id="logout">Çıkış</button></nav></div></header>
<main class="shell page compact-page">
<section class="page-head compact-head"><p class="eyebrow">GM · KAYNAK YÖNETİMİ</p><h1>Eşya & Focus</h1><p>Oyuncuya eşya ver ve Focus durumunu tek ekrandan yönet.</p><div id="statusMessage" class="status">Hazırlanıyor...</div></section>
<section class="panel compact-panel"><div class="form-grid"><div class="field"><label>KARAKTER</label><select id="characterSelect"><option>Karakterler yükleniyor...</option></select></div><div class="field"><label>MEVCUT DURUM</label><input id="characterStatus" value="—" disabled></div></div></section>
<div class="resource-duo">
  <section class="panel compact-panel"><p class="eyebrow">ENVANTER</p><h2>Eşya Ver</h2><div class="form-grid"><div class="field wide"><label>EŞYA ADI</label><input id="itemName" placeholder="Örn. Sağlık İksiri"></div><div class="field"><label>VERİLECEK ADET</label><input id="itemAmount" type="number" min="1" value="1"></div><div class="field"><label>MAKSİMUM ADET</label><input id="itemMax" type="number" min="1" value="1"></div><div class="field wide"><label>OYUNCU AÇIKLAMASI</label><input id="itemDescription" placeholder="Kısa ve okunaklı açıklama"></div></div><div class="actions"><button class="btn" id="giveItem">Eşyayı Ver</button></div></section>
  <section class="panel compact-panel"><p class="eyebrow">CANLI KAYNAK</p><h2>Focus</h2><div class="form-grid"><div class="field"><label>FOCUS DEĞİŞİMİ</label><input id="focusDelta" type="number" value="0"></div><div class="field"><label>MAKS. FOCUS</label><input id="focusMax" type="number" min="0" value="0"></div></div><div class="actions"><button class="btn secondary" id="updateFocus">Focus Güncelle</button></div><div id="liveFeed" class="status compact-status">Karakter seçildiğinde canlı durum burada görünür.</div></section>
</div>
